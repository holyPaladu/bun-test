# DATABASE_URL внутри .env сервисов рассчитан на localhost (для `bun run dev`
# на хосте) — здесь он переопределён на DNS-имя нужной БД в docker-сети.
# JWT-ключи auth-service берутся из services/auth-service/.env — см.
# services/auth-service/README.md по `cp .env.example .env` и `bun run jwt:generate-keys`.
# EVENT_TOKEN можно задать в корневом .env; одно значение передаётся обоим сервисам.

services:
  auth-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auth']
      interval: 5s
      timeout: 3s
      retries: 10

  # Собирает image auth-service. auth-migrate ниже переиспользует его же —
  # ради одного скрипта не нужен отдельный build.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: test-project/auth-service:latest
    env_file:
      - ./services/auth-service/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@auth-postgres:5432/auth
      PORT: 3000
      USER_EVENTS_URL: http://user-service:3001/internal/events
      EVENT_DELIVERY_TOKEN: ${EVENT_TOKEN:-replace-with-at-least-16-random-characters}
    ports:
      - '3000:3000'
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully

  # Без build: — переиспользует уже собранный image auth-service (Compose
  # строит все build:-сервисы до старта контейнеров, так что к моменту,
  # когда этот контейнер стартует, image уже готов). Миграции лежат в образе
  # бандлом, а не бинарём, — см. Dockerfile.
  auth-migrate:
    image: test-project/auth-service:latest
    env_file:
      - ./services/auth-service/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@auth-postgres:5432/auth
    command: ['bun', '/app/scripts/migrate.js']
    depends_on:
      auth-postgres:
        condition: service_healthy

  user-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports:
      - '5433:5432'
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d users']
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    image: test-project/user-service:latest
    environment:
      DATABASE_URL: postgres://postgres:postgres@user-postgres:5432/users
      PORT: 3001
      AUTH_JWKS_URL: http://auth-service:3000/.well-known/jwks.json
      EVENT_CONSUMER_TOKEN: ${EVENT_TOKEN:-replace-with-at-least-16-random-characters}
    ports:
      - '3001:3001'
    depends_on:
      user-postgres:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully

  # Миграции user-service запускаются из того же image, что и сам сервис.
  user-migrate:
    image: test-project/user-service:latest
    environment:
      DATABASE_URL: postgres://postgres:postgres@user-postgres:5432/users
      AUTH_JWKS_URL: http://auth-service:3000/.well-known/jwks.json
      EVENT_CONSUMER_TOKEN: ${EVENT_TOKEN:-replace-with-at-least-16-random-characters}
    command: ['bun', '/app/scripts/migrate.js']
    depends_on:
      user-postgres:
        condition: service_healthy

volumes:
  postgres_data:
  user_postgres_data:
